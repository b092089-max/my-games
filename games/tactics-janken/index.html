.home-world:after{content:"";position:absolute;inset:auto 0 0;height:45%;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 130%,#00bafa44,transparent 61%)}
.home-topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.home-version{border:1px solid #a98963;border-radius:20px;padding:5px 15px;background:#101932b3;color:#d4e5ff;font-weight:800;font-size:.85rem}
.home-audio{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home-audio button{color:#e1eaff;background:#111c39cc;border:1px solid #7098d0;border-radius:11px;min-height:38px;padding:6px 12px;font-size:.85rem;font-weight:800}
.home-audio button[aria-pressed="true"]{border-color:#f4c96c;color:#ffe9b1;background:#4b3925ed}
.home-title{text-align:center;position:relative;margin:4px 0 2px;font-size:clamp(2rem,4.9vw,4rem);line-height:1.2;font-weight:950;letter-spacing:.045em;color:#ffefbb;-webkit-text-stroke:.4px #bd8d4c;text-shadow:0 3px 0 #5b3a21,0 6px 12px #000b,0 0 28px #32c0fa6b}
.home-subtitle{text-align:center;font-weight:800;font-size:clamp(.81rem,1.6vw,1.03rem);letter-spacing:.07em;color:#d2eafa;margin:6px 0 15px;text-shadow:0 2px 6px #000}
.home-arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px) minmax(0,1fr);align-items:center;min-height:390px;gap:8px}
.home-sides{min-width:0;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.home-side-icon{width:min(190px,91%);aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 0 22px #20bdff65) drop-shadow(0 8px 16px #0008);animation:home-float 5.5s ease-in-out infinite}
.home-sides.right .home-side-icon{animation-delay:-2s}
.home-side-icon.small{width:min(128px,65%);animation-delay:-1.5s}
.home-grid-art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:min(205px,100%);padding:9px;border:1px solid #f6c66faa;border-radius:12px;background:#15294788;transform:perspective(450px) rotateY(12deg) rotateZ(-5deg);box-shadow:0 0 25px #4ce2fa23}
.home-sides.right .home-grid-art{transform:perspective(450px) rotateY(-12deg) rotateZ(5deg);border-color:#49a6e2aa}
.home-grid-art span{display:grid;place-items:center;aspect-ratio:1;background:linear-gradient(150deg,#1a3762,#223152);border:1px solid #89cdfbd9;border-radius:6px;font-size:clamp(.84rem,1.6vw,1.3rem);font-weight:900;color:#fff5da;text-shadow:0 0 9px #52cfff}
.home-actions{display:flex;flex-direction:column;gap:15px;position:relative;z-index:2;padding:8px}
.home-actions button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 15px;min-height:75px;border-radius:17px;border:2px solid #e1c687;font-weight:950;font-size:clamp(1rem,2.1vw,1.3rem);color:#fff7e2;text-shadow:0 2px 5px #000a;box-shadow:0 6px 0 #080d24,0 0 22px #0f7bc94d,inset 0 1px 0 #ffffff60;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
.home-actions button:hover{filter:brightness(1.17);transform:translateY(-2px)}
.home-actions button:active{transform:translateY(3px);box-shadow:0 2px 0 #080d24}
.home-actions .start{background:linear-gradient(155deg,#9a5b23,#5d301a 54%,#a16b2f);border-color:#ffdb84}
.home-actions .tutorial{background:linear-gradient(155deg,#1b6599,#183868 52%,#347ab0);border-color:#8cd5ff}
.home-actions .practice{background:linear-gradient(155deg,#255c97,#122e59 55%,#215c8c);border-color:#8bc9ec}
.home-actions .action-icon{font-size:1.55em;line-height:1}
.home-settings{margin-top:18px;background:linear-gradient(155deg,#182a47,#111a32);border:1px solid #4b6d99;border-radius:20px;box-shadow:0 8px 30px #03091a88;padding:24px}
.home-settings-heading{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:15px}
.home-settings-heading h2{margin:0;color:#ffdf9b;font-size:1.35rem}
.home-settings-desc{color:#a9c2e2;font-size:.86rem}
.home-settings .grid2{align-items:start}
.home-settings .pill{min-height:43px}
.home-settings .field{font-size:.9rem}
@keyframes home-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.home-side-icon{animation:none!important}.home-actions button{transition:none}}
@media(max-width:850px){.home-arena{grid-template-columns:minmax(0,1fr) minmax(250px,390px) minmax(0,1fr);min-height:345px}.home-actions button{min-height:67px}.home-sides{gap:11px}}
@media(max-width:650px){.home-world{padding:14px 12px 20px;border-radius:18px}.home-title{font-size:clamp(1.85rem,7vw,2.7rem);margin-top:14px}.home-audio button{padding:6px 9px;font-size:.76rem}.home-version{font-size:.75rem;padding:5px 9px}.home-arena{grid-template-columns:1fr;min-height:0;gap:2px}.home-sides{display:none}.home-actions{width:100%;max-width:420px;margin:2px auto 15px;gap:11px}.home-actions button{min-height:64px;font-size:1.04rem}.home-settings{padding:15px}.home-settings-heading h2{font-size:1.2rem}}

.home-count-picker{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;width:fit-content;max-width:100%;margin:12px auto 5px;padding:12px 20px;border-radius:18px;border:1px solid #cfa9668a;background:linear-gradient(110deg,#132d55e8,#20234deb);box-shadow:0 5px 20px #0005}
.home-count-caption{font-size:1rem;font-weight:900;color:#ffe3a9;white-space:nowrap}
.home-count-options{display:flex;gap:8px;align-items:center}

.home-count-options .pill.active{background:linear-gradient(135deg,#f3ce7e,#c98f46);color:#21190d;border-color:#fff2b5;box-shadow:0 0 18px #ffce6b66}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=()=>Math.random();
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){return shuffle(Array.from({length:40},(_,i)=>Math.floor(i/4)));}
// CPUはプレイヤーの未公開のカード・配置・今回選んだ手を参照しない。
function cpuPlayer(){return state.practice?player(1):null;}
function cpuRandomChoice(items){return items[Math.floor(R()*items.length)];}
function cpuScoreBoard(board,p){
 const s=stat(board,state.rule),active=p.hp.map((hp,i)=>hp>0?i:-1).filter(i=>i>=0);
 return active.reduce((sum,i)=>sum+Math.log1p(s.atk[i])*1.05+Math.log1p(s.def[i])*.88,0);
}
function cpuArrange(p){
 if(state.cpuDifficulty==='easy'){shuffle(p.board);return;}
 const trials=state.cpuDifficulty==='hard'?1400:230;
 let best=p.board.slice(),bestScore=-Infinity;
 for(let k=0;k<trials;k++){
  const candidate=shuffle(p.board.slice());
  const score=cpuScoreBoard(candidate,p)+R()*(state.cpuDifficulty==='hard'?1:3);
  if(score>bestScore){bestScore=score;best=candidate;}
 }
 p.board=best;
}
function cpuPrepare(p){
 const limit=2;
 if(state.cpuDifficulty!=='easy'&&state.drawPile.length){
  const bad=p.board.map((n,i)=>({n,i,quality:state.rule.id==='zero'&&n===0?10:n})).sort((a,b)=>a.quality-b.quality);
  for(const x of bad.slice(0,limit)){
   if(x.quality>=4||!state.drawPile.length)break;
   // 一度交換したカードは同じラウンド中に戻さない。
   p.board[x.i]=state.drawPile.shift();p.redrawUsed++;
  }
 }
 cpuArrange(p);
}
function cpuChoose(p){
 const options=unused(p);if(!options.length)return;
 if(state.cpuDifficulty==='easy'){p.choice=cpuRandomChoice(options);p.predictions={};return;}
 const me=stat(p.board,state.rule),opponent=state.players.find(x=>x.id!==p.id);
 const opponentChoices=unused(opponent);
 // 相手の残りの手だけを使う。相手の魔法陣や今回の確定手は見ない。
 const scores=options.map(h=>{
  let score=0;
  for(const other of opponentChoices){
   const win=(h+1)%3===other,lose=(other+1)%3===h,tie=h===other;
   const attackPressure=Math.min(me.atk[h],state.hpMax*2);
   const defenseProtection=Math.min(me.def[h],state.hpMax*2);
   score+=(win?2.3:tie?.55:-1.45)+ (win||tie?attackPressure/state.hpMax*.85:0)+(lose||tie?defenseProtection/state.hpMax*.6:0);
  }
  return score/Math.max(1,opponentChoices.length);
 });
 const best=Math.max(...scores);
 if(state.cpuDifficulty==='normal'&&R()<.32)p.choice=cpuRandomChoice(options);
 else {const shortlist=options.filter((h,i)=>scores[i]>=best-(state.cpuDifficulty==='hard'?.08:.65));p.choice=cpuRandomChoice(shortlist);}
 p.predictions={};
}
function stat(board,rule){const b=board.map(v=>(rule?.id==='zero' && v===0)?10:v); const atk=[0,1,2].map(c=>b[c]*b[c+3]*b[c+6]); const def=[0,1,2].map(r=>b[r*3]*b[r*3+1]*b[r*3+2]);
 const typ=rule?.id.startsWith('even')?'even':rule?.id.startsWith('odd')?'odd':null;
 const qualifies=arr=>arr.filter(v=>typ==='even'?v%2===0:v%2!==0).length>=2;
 if(typ){for(let i=0;i<3;i++){const col=[board[i],board[i+3],board[i+6]],row=board.slice(i*3,i*3+3);if(rule.id.endsWith('Rampage')){if(qualifies(col))atk[i]*=2;if(qualifies(row))def[i]=Math.floor(def[i]/2);}else if(qualifies(row))def[i]*=2;}}
 return {atk,def};}
const alivePlayers=()=>state.players.filter(p=>p.hp.some(h=>h>0));
const unused=(p)=>[0,1,2].filter(i=>p.hp[i]>0&&!p.used.includes(i));
const allHaveOneHand=(players=alivePlayers())=>players.length>1&&players.every(p=>unused(p).length===1);
const player=id=>state.players.find(p=>p.id===id);
// 全員が生存する手を1種類ずつ持ち、手の種類がちょうど2種類なら、
// じゃんけんの優劣で負ける種類を確定できる。魔法陣の強さはこの決着判定に使わない。
function remainingHandDecision(players=alivePlayers()){
 if(players.length<2||players.some(p=>p.hp.filter(v=>v>0).length!==1))return null;
 const hands=players.map(p=>({id:p.id,name:p.name,hand:p.hp.findIndex(v=>v>0),hp:p.hp.find(v=>v>0)}));
 const kinds=[...new Set(hands.map(p=>p.hand))];
 // 全員同じ手ならあいこ。3種類なら優劣が循環するため続行。
 if(kinds.length!==2)return null;
 const winningHand=(kinds[0]+1)%3===kinds[1]?kinds[0]:kinds[1];
 return {winningHand,losingHand:kinds.find(h=>h!==winningHand),winners:hands.filter(p=>p.hand===winningHand),losers:hands.filter(p=>p.hand!==winningHand)};
}
function resolveRemainingHands(){
 const decision=remainingHandDecision();
 if(!decision)return false;
 state.handDecision=decision;
 for(const loser of decision.losers){const p=player(loser.id);p.hp=[0,0,0];}
 clearTimeout(state.revealTimeout);state.revealAnimating=false;
 state.screen='hand-decision';render();window.scrollTo(0,0);
 return true;
}

// Original, procedural strategy BGM. All tones are generated locally by Web Audio; no remote assets.
const strategyMusic={ctx:null,timer:null,nextTime:0,step:0,master:null,playing:false};
function isPlanningScreen(){return state.screen==='setup'||state.screen==='choose';}
function musicControl(){return `<button class="music-toggle" type="button" data-action="bgm-toggle" aria-label="BGMを${state.bgmOn?'オフ':'オン'}にする" aria-pressed="${state.bgmOn}">${state.bgmOn?'♫ BGM オン':'♪ BGM オフ'}</button>`;}
function musicConfig(){return `<div class="music-config"><div class="label">🎵 BGM</div><div class="music-choice"><button type="button" class="pill ${state.bgmOn?'active':''}" aria-pressed="${state.bgmOn}" data-action="bgm-on">オン</button><button type="button" class="pill ${!state.bgmOn?'active':''}" aria-pressed="${!state.bgmOn}" data-action="bgm-off">オフ</button></div><span class="note">配置・手の選択中に流れます</span></div>`;}
function musicTone(freq,when,duration,volume,kind='sine'){
 const m=strategyMusic,c=m.ctx;if(!c||!m.master)return;
 const osc=c.createOscillator(),gain=c.createGain(),filter=c.createBiquadFilter();
 osc.type=kind;osc.frequency.setValueAtTime(freq,when);
 filter.type='lowpass';filter.frequency.setValueAtTime(kind==='triangle'?1100:1700,when);filter.Q.value=.55;
 const attack=kind==='triangle'?.035:.07,release=.18;
 gain.gain.setValueAtTime(.00001,when);
 gain.gain.linearRampToValueAtTime(volume,when+attack);
 gain.gain.setValueAtTime(volume,Math.max(when+attack,when+duration-release));
 gain.gain.exponentialRampToValueAtTime(.00001,when+duration);
 osc.connect(filter);filter.connect(gain);gain.connect(m.master);
 osc.start(when);osc.stop(when+duration+.025);
}
function musicTick(){
 const m=strategyMusic;if(!m.ctx||!m.playing)return;
 const c=m.ctx,stepSeconds=60/78/2;
 // Four repeating eight-step phrases: understated pentatonic motif with alternating minor-seven harmonies.
 const bass=[146.83,130.81,164.81,130.81]; // D3 C3 E3 C3
 const motifs=[[293.66,null,349.23,440,null,349.23,293.66,null],[261.63,null,329.63,392,null,329.63,261.63,null],[329.63,null,392,493.88,null,392,329.63,null],[261.63,null,293.66,392,null,293.66,261.63,null]];
 while(m.nextTime<c.currentTime+.18){
  const i=m.step%32,measure=Math.floor(i/8),beat=i%8;
  if(beat===0){musicTone(bass[measure],m.nextTime,2.6,.085,'sine');musicTone(bass[measure]*1.5,m.nextTime,2.1,.021,'sine');}
  if(beat===4)musicTone(bass[measure],m.nextTime,1.25,.042,'sine');
  const note=motifs[measure][beat];if(note)musicTone(note,m.nextTime,beat===3?1.0:.65,.029,beat===3?'triangle':'sine');
  m.step++;m.nextTime+=stepSeconds;
 }
}
function stopStrategyBgm(){
 const m=strategyMusic;if(m.timer!==null){clearInterval(m.timer);m.timer=null;}
 if(!m.playing)return;m.playing=false;
 if(m.master&&m.ctx){const now=m.ctx.currentTime;m.master.gain.cancelScheduledValues(now);m.master.gain.setTargetAtTime(.00001,now,.055);}
}
function syncStrategyBgm(){
 const m=strategyMusic;
 if(!state.bgmOn||!isPlanningScreen()||document.hidden){stopStrategyBgm();return;}
 try{
  if(!m.ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;m.ctx=new Audio();m.master=m.ctx.createGain();m.master.gain.value=.00001;m.master.connect(m.ctx.destination);}
  if(m.ctx.state==='suspended')m.ctx.resume().catch(()=>{});
  if(!m.playing){m.playing=true;m.step=0;m.nextTime=m.ctx.currentTime+.12;const now=m.ctx.currentTime;m.master.gain.cancelScheduledValues(now);m.master.gain.setValueAtTime(.00001,now);m.master.gain.setTargetAtTime(.42,now,.28);m.timer=setInterval(musicTick,70);musicTick();}
 }catch(_e){stopStrategyBgm();}
}
document.addEventListener('visibilitychange',syncStrategyBgm);

function practiceSettings(){
 const hpOpts=[100,200,300,400].map(v=>`<button class="pill ${state.practiceHp===v?'active':''}" data-practice-hp="${v}" aria-pressed="${state.practiceHp===v}">${v} HP</button>`).join('');
 const cpuOpts=[['easy','やさしい','気軽に練習'],['normal','ふつう','配置と手を考える'],['hard','つよい','読み合いを重視']].map(([id,name,desc])=>`<button class="practice-difficulty ${state.cpuDifficulty===id?'active':''}" data-cpu-difficulty="${id}" aria-pressed="${state.cpuDifficulty===id}"><strong>${name}</strong><span>${desc}</span></button>`).join('');
 return `<section class="panel practice-settings"><div class="flex" style="justify-content:space-between;align-items:center"><div><div class="eyebrow">SOLO PRACTICE</div><h1 class="practice-title">🤖 一人で練習</h1></div><button class="btn soft" data-action="home">← トップへ戻る</button></div><p>CPUと1対1で練習できます。数字の配置やじゃんけんの駆け引きは対人戦と同じです。</p><div class="practice-config"><div class="stack"><label class="field">自分の名前<input class="txt" maxlength="16" placeholder="プレイヤー1" data-practice-name value="${esc(state.practiceName)}" autocomplete="off"></label><div><div class="label" style="margin-bottom:9px">各手の初期HP</div><div class="pill-row">${hpOpts}</div></div><div><div class="label" style="margin-bottom:9px">対戦ルール</div><div class="pill-row"><button class="pill ${state.practiceRuleMode==='normal'?'active':''}" data-practice-rule="normal" aria-pressed="${state.practiceRuleMode==='normal'}">通常ルールのみ</button><button class="pill ${state.practiceRuleMode==='special'?'active':''}" data-practice-rule="special" aria-pressed="${state.practiceRuleMode==='special'}">特殊ルールあり</button></div></div></div><div class="stack"><div><div class="label" style="margin-bottom:9px">CPUの強さ</div><div class="practice-difficulties">${cpuOpts}</div></div></div></div><div style="margin-top:18px">${musicConfig()}</div><button class="btn gold large wide" style="margin-top:20px" data-action="practice-start">⚔ CPUと練習スタート</button></section>`;
}
function pStatus(){return '';}
function hpBars(p){return `<div class="player-hps">${HANDS.map((h,i)=>{let hp=p.hp[i],pc=Math.max(0,hp/state.hpMax*100);return `<div class="hpbox ${hp===0?'dead':hp/state.hpMax<=.3?'low':''}"><div class="hp-top"><span>${h.emoji} ${h.label}</span><b>${hp}/${state.hpMax}</b></div><div class="hp-track"><div class="hp-fill" style="width:${pc}%"></div></div></div>`;}).join('')}</div>`;}
function miniHp(p,i){let hp=p.hp[i],pc=Math.max(0,hp/state.hpMax*100);return `<div class="mini-hp ${hp/state.hpMax<=.3?'low':''}"><div class="mini-hp-value">HP ${hp}/${state.hpMax}</div><div class="mini-hp-track"><div class="mini-hp-fill" style="width:${pc}%"></div></div></div>`;}
function hpBarsResult(p){return `<div class="result-hp-list">${HANDS.map((h,i)=>{let hp=p.hp[i],pc=Math.max(0,hp/state.hpMax*100);return `<div class="result-hp-item ${hp===0?'dead':hp/state.hpMax<=.3?'low':''}"><div class="result-hp-top"><span class="result-hp-hand">${h.emoji} ${h.label}</span><strong>${hp}/${state.hpMax}</strong></div><div class="result-hp-track"><div class="result-hp-fill" style="width:${pc}%"></div></div></div>`;}).join('')}</div>`;}


function expectedTripleProduct(cards){
 if(cards.length<3)return 0;
 let sum=0,count=0;
 for(let i=0;i<cards.length-2;i++)for(let j=i+1;j<cards.length-1;j++)for(let k=j+1;k<cards.length;k++){
  sum+=cards[i]*cards[j]*cards[k];count++;
 }
 return sum/count;
}
// Scale estimated from random nine-card deals from the shared 0-9 x4 deck.
// These anchors represent approximate percentile ranks rather than a theoretical maximum.
const STRENGTH_PERCENTILES={
 normal:[[0,0],[22,5],[31,10],[44,20],[58,33],[78,50],[103,67],[129,80],[162,90],[192,95],[256,99],[450,100]],
 zero:[[0,0],[60,5],[74,10],[96,20],[120,33],[152,50],[188,67],[228,80],[275,90],[316,95],[401,99],[650,100]]
};
function strengthPercentile(value,zeroAwakening){
 const points=zeroAwakening?STRENGTH_PERCENTILES.zero:STRENGTH_PERCENTILES.normal;
 for(let i=1;i<points.length;i++){
  if(value<=points[i][0]){
   const [x0,y0]=points[i-1],[x1,y1]=points[i];
   return Math.max(0,Math.min(100,Math.round(y0+(y1-y0)*(value-x0)/(x1-x0))));
  }
 }
 return 100;
}
function cardStrengthHtml(board,rule){
 const zeroAwakening=rule?.id==='zero';
 const factorCards=board.map(n=>zeroAwakening&&n===0?10:n);
 const triple=Math.round(expectedTripleProduct(factorCards));
 const percentile=strengthPercentile(triple,zeroAwakening);
 const tier=percentile<15?0:percentile<35?1:percentile<65?2:percentile<85?3:4;
 const names=['とても弱い','やや弱い','ふつう','やや強い','とても強い'];
 const label=names[tier];
 return `<div class="deck-strength-meter strength-tier-${tier}" role="group" aria-label="9枚の数字の強さ ${triple}、評価 ${label}"><div class="deck-strength-meter-row"><span class="deck-strength-compact-title">📊 9枚の数字の強さ</span><strong class="deck-strength-compact-number">${triple}</strong><span class="deck-strength-rating">${label}</span></div><div class="deck-strength-track" role="img" aria-label="相対的な強さ ${percentile}パーセント"><div class="deck-strength-fill" style="width:${percentile}%"></div></div><div class="deck-strength-scale" aria-hidden="true"><span>弱い</span><span>標準</span><span>強い</span></div></div>`;
}

function computeBattle(){let a=state.choiceIds.map(id=>player(id)).filter(Boolean);let entries=a.map(p=>({id:p.id,name:p.name,hand:p.choice,attack:stat(p.board,state.rule).atk[p.choice],defense:stat(p.board,state.rule).def[p.choice],before:p.hp[p.choice],predictions:{...(p.predictions||{})}}));let out=[];for(let d of entries){let attacks=[];for(let s of entries){if(s.id===d.id)continue;let tie=s.hand===d.hand;let wins=(s.hand===0&&d.hand===1)||(s.hand===1&&d.hand===2)||(s.hand===2&&d.hand===0);if(tie||wins){let dmg=Math.max(0,s.attack-d.defense);attacks.push({from:s.name,sourceId:s.id,attack:s.attack,damage:dmg,hand:s.hand});}}let best=attacks.sort((a,b)=>b.damage-a.damage)[0]||null;let damage=best?best.damage:0;out.push({...d,attacks,damage,source:best?best.from:null,remaining:Math.max(0,d.before-damage)});}

 return `<section class="hand-decision-stage" aria-live="polite"><div class="eyebrow">LAST HAND · 最後の手で決着</div><h1>残りの手で勝敗判定！</h1><p class="hand-decision-lead">全員が残り1種類の手になりました。<br>じゃんけんの相性で、勝つ手と負ける手が決まりました。</p><div class="hand-decision-versus"><div class="hand-decision-team win"><span class="hand-decision-label">勝ち</span><div class="hand-decision-emoji">${HANDS[d.winningHand].emoji}</div><strong>${HANDS[d.winningHand].label}</strong><div class="hand-decision-names">${d.winners.map(x=>esc(x.name)+'さん').join('・')}</div></div><div class="hand-decision-vs">VS</div><div class="hand-decision-team lose"><span class="hand-decision-label">負け・脱落</span><div class="hand-decision-emoji">${HANDS[d.losingHand].emoji}</div><strong>${HANDS[d.losingHand].label}</strong><div class="hand-decision-names">${d.losers.map(x=>esc(x.name)+'さん').join('・')}</div></div></div><p class="note">この判定では攻撃力・防御力・残りHPによるダメージ計算は行いません。</p><p class="hand-decision-message">${final?`🏆 ${esc(d.winners[0].name)}さんの優勝が決定！`:'勝った手を持つプレイヤー同士はあいこなので、対戦を続けます。'}</p><button class="btn gold large wide" data-action="hand-decision-next">${final?'最終結果を見る':'残ったプレイヤーで対戦を続ける'}</button></section>`;

function gameover(){let survivors=alivePlayers();let winner=survivors.length===1?survivors[0]:null;return `<section class="private"><div class="symbol">${winner?'🏆':'🤝'}</div><div class="eyebrow">${winner&&state.handDecision?'最後の手で決着 · 対戦終了':'対戦終了'}</div><h1>${winner?`${esc(winner.name)}さんの勝利！`:'引き分け！'}</h1><p>${state.round}ラウンドの激戦、おつかれさまでした。</p><div class="grid2" style="text-align:left;margin:23px 0">${state.players.map(p=>`<div class="player-card"><strong>${esc(p.name)}</strong><div class="note">残りHP合計：${p.hp.reduce((s,h)=>s+h,0)}</div>${hpBars(p)}</div>`).join('')}</div><button class="btn gold large wide" data-action="home">トップページへ戻る</button></section>`;}
function tutorial(){
 let step=state.tutorialStep;
 const titles=TUTORIAL_TITLES;
 let body='';
 if(step===0)body=`
 <p>配られた数字9枚を魔法陣に並べ、グー・チョキ・パーで競う2〜4人用の対戦ゲームです。相手の3つの手をすべてHP0にすると勝利します。</p>
 <div class="tutorial-keyphrase">勝てる手を出すだけが、勝つ方法じゃない！</div>
 <div class="tutorial-highlight">このゲームの醍醐味は、<strong>① 数字9枚をどう配分するか</strong>、<strong>② 相手の残りの手を読んで何を出すか</strong>、そして<strong>③ ときには、わざとじゃんけんに負けるか</strong>という駆け引きです。</div>
 <div class="rule-art" style="border-radius:15px;max-width:570px;margin:auto">${svgRps()}</div>
 <p style="margin:15px 0 0">攻撃力が高くても、じゃんけんで負ければ攻撃できません。反対に、負けても防御力が高ければ、ダメージを0にできることがあります。</p>`;
 if(step===1){let stats=stat(state.tutorialBoard,{id:'normal'});body=`
 <p>数字を2枚クリックして場所を交換してみましょう。<strong>縦3枚の積が攻撃力、横3枚の積が防御力</strong>になります。配置を変えると3つの手の強さが変わります。</p>
 <div class="challenge">チャレンジ：グーの攻撃力を、現在の <b>${stats.atk[0]}</b> より大きくしてみよう！</div>
 <div class="tutorial-demo">${boardHtml(state.tutorialBoard,{interactive:true,selected:state.tutorialSelection,rule:{id:'normal'}})}</div>
 <div class="tutorial-highlight">数字は9枚しかありません。<strong>1つの手の攻撃を強くすると、ほかの手の攻撃や防御にも影響します。</strong> どの手を強くするか、あえて弱い手をつくるかも戦略です。</div>`;}
 if(step===2){let stats=stat(state.tutorialBoard,{id:'normal'});body=`
 <p>3つの手には、それぞれ<strong>攻撃力と防御力</strong>があります。強い攻撃だけでなく、相手の一撃に耐えられる防御も重要です。</p>
 <div class="tactic-overview">${HANDS.map((h,i)=>`<div class="stat"><div class="hand">${h.emoji}</div><strong>${h.label}</strong><div class="pair"><span>攻撃 ${stats.atk[i]}</span><span>防御 ${stats.def[i]}</span></div></div>`).join('')}</div>
 <p class="note center">前のページで並べた9枚から計算した数値です。</p>
 <div class="tutorial-highlight"><strong>攻撃重視：</strong>相手に大きなダメージを狙う。<br><strong>防御重視：</strong>不利なじゃんけんでもHPを守る。<br><strong>バランス重視：</strong>どの手を出しても戦えるようにする。</div>
 <p>すべての手を最強にはできません。<strong>どの手で攻め、どの手で受けるか</strong>を、配置を決める前に考えてみましょう。</p>`;}
 if(step===3)body=`
 <p>数字を配置したら、グー・チョキ・パーを<strong>同じラウンドでそれぞれ1回まで</strong>使います。最初に強い手を出すか、後の勝負まで残すかも読み合いです。</p>
 <div class="grid3">${HANDS.map((h,i)=>`<div class="stat"><div style="font-size:2.6rem">${h.emoji}</div><strong>${h.label}</strong><span class="note">出した手は同じラウンドではもう使えません</span></div>`).join('')}</div>
 <div class="tutorial-highlight">数字の配置画面と手の選択画面では、<strong>相手がまだ出せる手</strong>だけを確認できます。相手が今回選んだ手は公開されないので、残りの手とこれまでの行動から予想して選びます。</div>
 <p>HP0の手は出せません。対戦回数は、生存している参加者の中で使用可能な手が最も少ない人に合わせます。<strong>全員が1種類の手だけになり、その手が2種類に分かれた場合は、数字で戦わずにじゃんけんの相性で決着します。</strong> 同じ手だけの場合、または3種類すべてが残る場合は、対戦が続きます。</p>`;
 if(step===4)body=`
 <p>じゃんけんに<strong>勝った側が攻撃</strong>し、負けた側が受けます。同じ手の<strong>あいこは、お互いに攻撃</strong>します。</p>
 <div class="tutorial-box"><div class="flex" style="justify-content:space-around"><span style="font-size:3rem">✊</span><strong>VS</strong><span style="font-size:3rem">✌️</span></div><p class="center">グーの攻撃力180、チョキの防御力65なら</p><div class="center" style="font-size:clamp(1.25rem,4.2vw,1.55rem);color:var(--gold);font-weight:900">180 − 65 = 115 ダメージ</div><p class="center note" style="margin-bottom:0">HP200なら、チョキのHPは85。減ったHPは次のラウンドにも引き継がれます。</p></div>
 <p style="margin-top:15px">防御力が攻撃力以上ならダメージは<strong>0</strong>です。4人戦などで複数の相手から攻撃されても、受けるのは<strong>最大の1撃だけ</strong>です。</p>`;
 if(step===5)body=`
 <p>じゃんけんでは、<strong>相手の「まだ出せる手」だけが分かります。</strong> 実際に何を選んだかは「ポン！」まで秘密です。</p>
 <div class="tactic-opponent"><strong>例えば、相手の残りの手がこの2つだったら？</strong><div class="icons">✊ ✋</div><span class="note">相手はグーかパーのどちらかを選びます</span></div>
 <p><strong>あなたなら、どちらを出しますか？</strong> 選んで結果の可能性を比べてみましょう。</p>
 <div class="tactic-buttons"><button type="button" class="tactic-choice ${state.tutorialTactic==='paper'?'active':''}" data-tactic="paper"><span class="icon">✋</span>パーを出す</button><button type="button" class="tactic-choice ${state.tutorialTactic==='scissors'?'active':''}" data-tactic="scissors"><span class="icon">✌️</span>チョキを出す</button></div>
 ${state.tutorialTactic==='paper'?`<div class="tactic-feedback" aria-live="polite"><div class="verdict">✋ パーを選んだ場合</div>相手が<strong>✊ グー</strong>なら勝ち。相手が<strong>✋ パー</strong>ならあいこで双方攻撃です。<br><b>グーを読むなら有力ですが、あいこになったときの防御力も考えましょう。</b></div>`:state.tutorialTactic==='scissors'?`<div class="tactic-feedback" aria-live="polite"><div class="verdict">✌️ チョキを選んだ場合</div>相手が<strong>✋ パー</strong>なら勝ち。相手が<strong>✊ グー</strong>なら負けです。<br><b>パーを読むなら有力ですが、負けた場合の防御力も考えましょう。</b></div>`:`<div class="tactic-feedback">どちらにも勝てる相手と、危険な相手がいます。<strong>相手が何を出しそうか</strong>を想像して選ぶのが戦略です。</div>`}
 <div class="tutorial-highlight">実戦では、<strong>相手ごとに出す手を予想する</strong>こともできます。予想は<strong>任意</strong>。「ポン！」で当たれば<strong>🎯 予想的中！</strong>と表示されますが、<strong>ダメージ・HP・勝敗には一切影響しません。</strong>予想しなくても不利になりません。</div><p>さらに、<strong>相手の残りHPや、自分が次に残したい手</strong>も考慮すると、読み合いはもっと深くなります。</p>`;
 if(step===6)body=`
 <p>普通のじゃんけんでは「負け」は失敗。でもこのゲームでは、<strong>わざと負ける選択が有利になる</strong>こともあります。</p>
 <div class="tactic-example"><div class="tactic-fighter"><div class="note">自分</div><div class="emoji">✊</div><strong>グー</strong><div class="stats">防御 160</div></div><div class="tactic-vs">負け</div><div class="tactic-fighter"><div class="note">相手</div><div class="emoji">✋</div><strong>パー</strong><div class="stats">攻撃 120</div></div></div>
 <div class="tutorial-keyphrase">120 − 160 → ダメージ 0！</div>
 <div class="tutorial-highlight">じゃんけんは負けでも、<strong>防御力が上回ればHPは減りません。</strong> 攻撃力の高い別の手を後の勝負に残すために、防御力の高い手であえて負ける――それも立派な作戦です。</div>
 <p class="note">これは考え方を示す例です。実際には相手の選んだ手や攻撃力は事前に分からず、予想が外れることもあります。また、使った手はそのラウンドでは再使用できません。</p>
 <p><strong>目先のじゃんけんの勝ち負けだけではなく、残りHPと次の勝負まで考えること</strong>が勝利につながります。</p>`;
 if(step===7)body=`
 <p>ゲーム開始前に<strong>「通常ルールのみ」</strong>と<strong>「特殊ルールあり」</strong>を選べます。特殊ルールありの場合は、ラウンドごとに6種類からルールが選ばれ、数字の配置で有利不利が変わります。</p>
 <details style="margin:12px 0"><summary style="cursor:pointer;padding:12px;background:#1a3150;border-radius:10px;font-weight:800">6種類のルールを見る</summary><div class="grid2" style="margin-top:12px">${RULES.map(r=>`<div class="player-card"><strong>${r.name}</strong><div class="note">${r.desc}</div></div>`).join('')}</div></details>
 <p>また、数字カードは<strong>2〜3人戦で2枚まで、4人戦で1枚まで</strong>引き直せます。狙う攻撃や防御に合わせて交換することも戦略です。</p>`;
 if(step===8)body=`
 <p>同じPCで遊ぶため、<strong>カード・魔法陣・選んだ手をほかの人に見せない</strong>ことが大切です。最初の勝負では数字の配置と手の選択を続けて行い、その後で次の人へPCを渡します。</p>
 <div class="rule-art" style="border-radius:15px;max-width:540px;margin:auto">${svgPass()}</div>
 <div class="tutorial-highlight">数字を配置 → 第1戦の手を選択 → PCを渡す → 全員の手が決まったら<strong>「じゃんけん・・・ポン！」</strong>で一斉公開！</div>
 <p>受け渡し時は本人が受け取ったことを確認し、周囲に誰もいないか確かめてから秘密の画面を開きます。<strong>ラウンド中のすべての勝負が終わるまで、他人の魔法陣は見られません。</strong></p>
 <p class="tutorial-keyphrase">さあ、数字の配置と相手の心理を読み合おう！</p><p class="note">一人で遊ぶときはトップページの「一人で練習」からCPUと対戦できます。CPUへの手の予想も任意で楽しめます。</p>`;
 return `<section class="panel"><div class="flex" style="justify-content:space-between"><div><div class="eyebrow">TUTORIAL</div><h2 style="margin:7px 0">チュートリアル</h2></div><button class="btn soft" data-action="home">トップへ戻る</button></div><div class="stepper">${titles.map((t,i)=>`<div class="step ${i===step?'current':i<step?'done':''}"><i>${i+1}</i>${i===step?esc(t):''}</div>`).join('')}</div><div class="tutorial-box"><h3>${step+1}. ${titles[step]}</h3>${body}</div><div class="flex" style="justify-content:space-between;margin-top:20px"><button class="btn" data-action="tutorial-prev" ${step===0?'disabled':''}>← 前へ</button><button class="btn gold" data-action="tutorial-next">${step===titles.length-1?'チュートリアル完了・トップへ':'次へ →'}</button></div></section>`;
}
function startMatch(){state.practice=false;clearTimeout(state.revealTimeout);state.revealAnimating=false;state.predictionDraft={};state.handDecision=null;let raw=Array.from(document.querySelectorAll('[data-player-name]'));raw.forEach(x=>state.names[Number(x.dataset.playerName)]=x.value.trim());state.players=Array.from({length:state.n},(_,i)=>({id:i,name:state.names[i]||`プレイヤー${i+1}`,hp:[state.hpMax,state.hpMax,state.hpMax],board:[],used:[],redrawUsed:0,choice:null,totalDamage:0}));state.round=0;startRound(true);}
function startPractice(){
 clearTimeout(state.revealTimeout);state.revealAnimating=false;state.handDecision=null;state.predictionDraft={};
 state.practice=true;state.n=2;state.hpMax=state.practiceHp;state.ruleMode=state.practiceRuleMode;
 state.players=[{id:0,name:state.practiceName.trim()||'プレイヤー1',hp:[state.hpMax,state.hpMax,state.hpMax],board:[],used:[],redrawUsed:0,choice:null,totalDamage:0},
 {id:1,name:'CPU',cpu:true,hp:[state.hpMax,state.hpMax,state.hpMax],board:[],used:[],redrawUsed:0,choice:null,totalDamage:0}];
 state.round=0;startRound(true);
}
function startRound(first=false){if(!first&&resolveRemainingHands())return;state.round++;state.rule=state.ruleMode==='normal'?RULES[0]:RULES[Math.floor(R()*RULES.length)];state.drawPile=makeDeck();let live=alivePlayers();for(let p of live){p.board=state.drawPile.splice(0,9);p.used=[];p.redrawUsed=0;p.choice=null;p.predictions={};}state.setupIds=live.map(p=>p.id);state.setupIndex=0;state.firstClashPending=true;state.clash=0;state.clashCap=Math.min(...live.map(p=>p.hp.filter(h=>h>0).length));state.result=null;if(state.practice){const cpu=cpuPlayer();if(cpu&&live.includes(cpu))cpuPrepare(cpu);state.currentId=0;state.nextStage='setup';state.screen='setup';state.selection=null;state.selectedDraw=[];state.mode='move';state.predictionDraft={};render();}else readyTo(state.setupIds[0],'setup');}
function setupDone(){if(state.screen!=='setup')return;state.clash=1;state.choiceIds=state.setupIds.slice();state.choiceIndex=state.setupIndex;state.handSelection=null;state.selection=null;state.selectedDraw=[];
 if(state.practice){
  const cpu=cpuPlayer();
  if(allHaveOneHand()){for(const p of alivePlayers())p.choice=unused(p)[0];state.firstClashPending=false;state.screen='auto-janken';render();return;}
  if(cpu)cpuChoose(cpu);
  state.screen='choose';render();return;
 }
 if(allHaveOneHand()){const p=player(state.currentId);p.choice=unused(p)[0];if(state.setupIndex<state.setupIds.length-1){state.setupIndex++;handoffTo(state.setupIds[state.setupIndex],'setup');}else{state.firstClashPending=false;state.screen='auto-janken';render();}return;}
 state.screen='choose';render();}
function beginClash(){let active=alivePlayers();if(active.length<=1){state.screen='gameover';render();return;}state.choiceIds=active.filter(p=>unused(p).length>0).map(p=>p.id);if(state.choiceIds.length!==active.length){startRound();return;}state.choiceIndex=0;for(const p of active)p.predictions={};
 if(allHaveOneHand(active)){for(const p of active)p.choice=unused(p)[0];state.screen='auto-janken';render();return;}
 if(state.practice){const cpu=cpuPlayer();if(cpu)cpuChoose(cpu);state.currentId=0;state.handSelection=null;state.predictionDraft={};state.screen='choose';render();return;}
 handoffTo(state.choiceIds[0],'choose');}
function choiceDone(){if(state.screen!=='choose')return;let p=player(state.currentId);if(state.handSelection===null||p.hp[state.handSelection]===0||p.used.includes(state.handSelection))return;p.choice=state.handSelection;p.predictions={};for(const other of alivePlayers()){if(other.id===p.id)continue;const guess=state.predictionDraft[other.id];if(Number.isInteger(guess)&&unused(other).includes(guess))p.predictions[other.id]=guess;}state.handSelection=null;state.predictionDraft={};if(state.practice){state.firstClashPending=false;showJanken();return;}if(state.firstClashPending){if(state.setupIndex<state.setupIds.length-1){state.setupIndex++;handoffTo(state.setupIds[state.setupIndex],'setup');}else{state.firstClashPending=false;showJanken();}}else if(state.choiceIndex<state.choiceIds.length-1){state.choiceIndex++;handoffTo(state.choiceIds[state.choiceIndex],'choose');}else showJanken();}
function afterResult(){if(alivePlayers().length<=1){state.screen='gameover';render();return;}if(resolveRemainingHands())return;if(hasNextClash()){state.clash++;beginClash();}else startRound();}
function afterHandDecision(){
 if(state.screen!=='hand-decision')return;
 if(alivePlayers().length<=1){state.screen='gameover';render();return;}
 state.handDecision=null;
 if(hasNextClash()){state.clash++;beginClash();}else startRound();
}
function changeCell(i){let b=state.screen==='setup'?player(state.currentId).board:state.tutorialBoard;if(state.screen==='tutorial'){if(state.tutorialSelection===null){state.tutorialSelection=i;}else{[b[i],b[state.tutorialSelection]]=[b[state.tutorialSelection],b[i]];state.tutorialSelection=null;}render();return;}
 let p=player(state.currentId);if(state.mode==='draw'){let idx=state.selectedDraw.indexOf(i),limit=(alivePlayers().length===4?1:2)-p.redrawUsed;if(idx>=0)state.selectedDraw.splice(idx,1);else if(state.selectedDraw.length<limit)state.selectedDraw.push(i);}else{if(state.selection===null)state.selection=i;else{[b[i],b[state.selection]]=[b[state.selection],b[i]];state.selection=null;}}render();}
function redrawCards(){let p=player(state.currentId),limit=alivePlayers().length===4?1:2;if(p.redrawUsed+state.selectedDraw.length>limit||state.selectedDraw.length>state.drawPile.length)return;for(let i of state.selectedDraw){p.board[i]=state.drawPile.shift();p.redrawUsed++;}state.selectedDraw=[];if(p.redrawUsed===limit)state.mode='move';render();}
app.addEventListener('input',ev=>{if(ev.target.matches('[data-player-name]'))state.names[Number(ev.target.dataset.playerName)]=ev.target.value;if(ev.target.matches('[data-practice-name]'))state.practiceName=ev.target.value;});
app.addEventListener('click',ev=>{const hit=ev.target.closest('button');if(!hit||hit.disabled)return;
 if(hit.dataset.hp){state.hpMax=Number(hit.dataset.hp);render();return;}
  if(hit.dataset.practiceHp){state.practiceHp=Number(hit.dataset.practiceHp);render();return;}
  if(hit.dataset.practiceRule){state.practiceRuleMode=hit.dataset.practiceRule;render();return;}
  if(hit.dataset.cpuDifficulty){state.cpuDifficulty=hit.dataset.cpuDifficulty;render();return;}
 if(hit.dataset.action==='bgm-toggle'){state.bgmOn=!state.bgmOn;render();return;}
 if(hit.dataset.action==='bgm-on'){state.bgmOn=true;render();return;}
 if(hit.dataset.action==='bgm-off'){state.bgmOn=false;render();return;}
 if(hit.dataset.count){state.n=Number(hit.dataset.count);render();return;}
 if(hit.dataset.ruleMode){state.ruleMode=hit.dataset.ruleMode;render();return;}
 if(hit.dataset.slot!==undefined){if(state.screen==='setup'||state.screen==='tutorial'&&state.tutorialStep===1)changeCell(Number(hit.dataset.slot));return;}
 if(hit.dataset.tactic&&state.screen==='tutorial'&&state.tutorialStep===5){state.tutorialTactic=hit.dataset.tactic;render();return;}
 if(hit.dataset.predictPlayer!==undefined&&state.screen==='choose'){const opponent=player(Number(hit.dataset.predictPlayer));const p=player(state.currentId);if(opponent&&p&&opponent.id!==p.id&&alivePlayers().some(x=>x.id===opponent.id)){const h=hit.dataset.predictHand;if(h==='none'){delete state.predictionDraft[opponent.id];}else{const choice=Number(h);if(unused(opponent).includes(choice)){if(state.predictionDraft[opponent.id]===choice)delete state.predictionDraft[opponent.id];else state.predictionDraft[opponent.id]=choice;}}render();}return;}
 if(hit.dataset.pick!==undefined){state.handSelection=Number(hit.dataset.pick);render();return;}
 let action=hit.dataset.action;if(!action)return;
 if(action==='start')startMatch();
  else if(action==='practice-open'){state.screen='practice-settings';render();}
  else if(action==='practice-start')startPractice();
 else if(action==='home'){state.screen='home';render();}
 else if(action==='tutorial'){state.tutorialStep=0;state.tutorialBoard=[9,2,3,4,5,6,7,8,1];state.tutorialSelection=null;state.tutorialTactic=null;state.screen='tutorial';render();}
 else if(action==='tutorial-prev'){state.tutorialStep=Math.max(0,state.tutorialStep-1);render();}
 else if(action==='tutorial-next'){if(state.tutorialStep>=TUTORIAL_TITLES.length-1)state.screen='home';else state.tutorialStep++;render();}
 else if(action==='handoff-done'){state.screen='ready';render();}
 else if(action==='ready-done'){state.screen=state.nextStage;render();}
 else if(action==='mode-move'){state.mode='move';state.selection=null;state.selectedDraw=[];render();}
 else if(action==='mode-draw'){state.mode='draw';state.selection=null;state.selectedDraw=[];render();}
 else if(action==='redraw')redrawCards();
 else if(action==='setup-done')setupDone();
 else if(action==='back-to-setup'&&state.screen==='choose'&&state.firstClashPending){state.handSelection=null;state.screen='setup';render();}
 else if(action==='choose-done')choiceDone();
 else if(action==='auto-janken-next'&&state.screen==='auto-janken')showJanken();
 else if(action==='sound-toggle'&&state.screen==='janken'){state.soundOn=!state.soundOn;render();}
 else if(action==='sound-home-toggle'&&state.screen==='home'){state.soundOn=!state.soundOn;render();}
 else if(action==='pon'&&state.screen==='janken'){playPonSound();computeBattle();}
 else if(action==='skip-reveal'&&state.screen==='result')finishReveal();
 else if(action==='result-next')afterResult();
 else if(action==='hand-decision-next')afterHandDecision();
});
render();
</script>
</body>
</html>
