<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e1b">
<meta name="description" content="オリジナルブラウザゲームを集めたゲームポータル。数学RPG、対戦、パズル、トランプなど。">
<title>GAME WORLD | オリジナルゲームポータル</title>
<style>
:root{color-scheme:dark;--bg:#080e1b;--panel:#111d31;--panel2:#172641;--line:#2b3d59;--text:#f2f6ff;--muted:#a2b2cc;--accent:#62b8ff;--gold:#ffd37a}
*{box-sizing:border-box}html{scroll-behavior:smooth;scrollbar-gutter:stable}body{margin:0;background:radial-gradient(ellipse 85vw 320px at 50% -80px,#1b3b70 0%,transparent 85%) fixed,var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
header{border-bottom:1px solid #ffffff13;background:#080e1bcc;backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:1.15rem;font-weight:900;letter-spacing:.13em;white-space:nowrap}.brand b{color:var(--accent)}.nav{display:flex;gap:22px;color:var(--muted);font-size:.91rem}.nav a:hover{color:white}
.hero{margin:34px 0 38px;min-height:310px;display:flex;align-items:center;position:relative;overflow:hidden;border:1px solid #40618b;border-radius:24px;background:radial-gradient(circle at 78% 43%,#3464a0aa,transparent 34%),linear-gradient(115deg,#172d53,#101c33 65%,#1b2344);padding:clamp(25px,5vw,62px)}.hero:after{content:'✦';position:absolute;right:8%;top:10%;font-size:clamp(150px,24vw,300px);line-height:1;color:#9ed8ff13;transform:rotate(-15deg);pointer-events:none}.hero>div{position:relative;z-index:1;max-width:690px}.eyebrow{font-size:.78rem;letter-spacing:.17em;font-weight:800;color:#92d2ff}.hero h1{font-size:clamp(2.2rem,5.5vw,4.4rem);line-height:1.13;letter-spacing:.04em;margin:13px 0 18px}.hero h1 span{color:#8ad1ff}.hero p{max-width:580px;color:#c4d4ed;margin:0 0 26px}.hero-link{display:inline-flex;align-items:center;gap:9px;border-radius:12px;background:#e4f3ff;color:#102642;padding:11px 20px;font-weight:800}.hero-link:hover{background:white}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:17px}.section-head h2{font-size:1.45rem;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:.9rem}.count{color:var(--muted);font-size:.9rem;white-space:nowrap}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 23px}.search{flex:1 1 260px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;color:white;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #62b8ff22}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#14223a;color:#c1d0e6;border-radius:10px;padding:9px 13px;font-size:.85rem}.filter.active,.filter:hover{border-color:#66baff;background:#1d4267;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}.game{overflow:hidden;background:linear-gradient(155deg,#15243c,#101a2c);border:1px solid #2c3b53;border-radius:17px;display:flex;flex-direction:column;transition:transform .18s,border-color .18s}.game:hover{transform:translateY(-4px);border-color:#70b9ff}.art{aspect-ratio:2/1;height:auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 65% 30%,var(--glow),transparent 56%),linear-gradient(135deg,var(--start),var(--end))}.art:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(125deg,transparent 0 38px,#ffffff07 39px 40px)}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art-symbol{font-size:4.5rem;line-height:1;filter:drop-shadow(0 10px 18px #0007);z-index:1}.art-word{position:absolute;bottom:12px;left:17px;right:17px;font-size:.73rem;font-weight:900;letter-spacing:.13em;text-shadow:0 2px 7px #000b;z-index:1}.game-body{padding:19px;display:flex;flex:1;flex-direction:column}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tag{font-size:.7rem;color:#acd9ff;background:#1d3958;border:1px solid #30547b;padding:2px 9px;border-radius:99px}.tag.dev{color:#ffdfaa;background:#47351f;border-color:#70522b}.game h3{font-size:1.12rem;line-height:1.4;margin:0 0 8px}.desc{font-size:.88rem;color:#adbed5;margin:0 0 20px;flex:1}.play{width:100%;text-align:center;display:block;border:1px solid #5da8e6;border-radius:10px;padding:9px 12px;font-weight:800;background:#163a60;color:#d7eeff}.play:hover{background:#225381}.play.disabled{border-color:#36455b;background:#1a2738;color:#8a9ab1;cursor:not-allowed}.empty{padding:50px 20px;text-align:center;border:1px dashed #3b4e68;border-radius:16px;color:var(--muted)}.about{margin:60px 0 45px;padding:25px 29px;background:#111e33;border:1px solid var(--line);border-radius:18px}.about h2{margin:0 0 7px;font-size:1.2rem}.about p{margin:0;color:var(--muted);font-size:.9rem}footer{border-top:1px solid #23324a;padding:25px 0 35px;color:#8193ad;font-size:.8rem;text-align:center}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:590px){.wrap{width:min(100% - 26px,1180px)}.top{height:61px}.nav{gap:12px;font-size:.79rem}.brand{font-size:.98rem}.hero{margin:20px 0 30px;min-height:270px;padding:25px 22px}.hero p{font-size:.9rem}.grid{grid-template-columns:1fr}.art{height:auto}.tools{display:block}.search{width:100%;margin-bottom:12px}.filters{gap:6px}.filter{padding:8px 10px}.about{margin-top:38px;padding:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
.header-tools{display:flex;align-items:center;gap:10px;flex:1;min-width:0;justify-content:flex-end}.header-tools .search{flex:1 1 330px;max-width:490px;width:100%;padding:10px 14px}.category-select{appearance:none;background:#14223a;color:#e5f1ff;border:1px solid var(--line);border-radius:11px;padding:11px 35px 11px 14px;font:inherit;cursor:pointer;min-width:132px}.category-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.category-wrap{position:relative;flex:none}.category-wrap:after{content:"⌄";position:absolute;right:13px;top:50%;transform:translateY(-55%);pointer-events:none;color:#9bc7ef}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#games{padding-top:26px}@media(max-width:650px){.top{height:auto;min-height:65px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px;gap:10px}.header-tools{flex-basis:100%;width:100%}.header-tools .search{min-width:0;max-width:none;margin:0;font-size:14px}.category-select{min-width:105px;padding-left:10px;padding-right:25px;font-size:13px}.category-wrap:after{right:9px}#games{padding-top:18px}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="./" aria-label="GAME WORLD トップ">✦ GAME <b>WORLD</b></a><div class="header-tools"><input id="search" class="search" type="search" placeholder="🔎 ゲーム名・説明から検索" aria-label="ゲームを検索"><label class="category-wrap"><span class="sr-only">ジャンルで絞り込み</span><select id="filters" class="category-select" aria-label="ジャンルで絞り込み"></select></label></div></div></header>
<main class="wrap">
<section id="games" aria-label="ゲームを探す">

<div id="grid" class="grid"></div><div id="empty" class="empty" hidden>該当するゲームがありません。検索条件を変更してください。</div></section>

</main><footer>© <span id="year"></span> GAME WORLD · Original Browser Games</footer>
<script>
'use strict';
/* =============================================================
  ゲーム登録リスト：ここだけ編集すればカードを追加・更新できます。
  published: true にすると「ゲームをプレイ」リンクが有効になります。
  url は GitHub Pages 内の相対パス、または https:// で始まるURL。
  image に画像パス（例 assets/thumbnails/duel.webp）を指定可能。
  ※公開前にURLの実在と動作を確認してください。
============================================================= */
const games = [
  {title:'数式デュエル：インフィニティ',category:'数学',tags:['数学','カードRPG'],description:'数字と演算カードを組み合わせて数式を作り、次々と現れる敵に挑む戦略カードRPG。',url:'games/math-duel/index.html',published:true,icon:'∞',word:'FORMULA DUEL',start:'#32246d',end:'#111e43',glow:'#aa77ff',image:'assets/thumbnails/math-duel.png'},
  {title:'MATHMON CHAMPIONS',category:'数学',tags:['数学','育成RPG'],description:'数学の問題に挑みながら、モンスターの育成やバトルを楽しむ冒険ゲーム。',url:'games/mathmon/index.html',published:true,icon:'✧',word:'MATHMON CHAMPIONS',start:'#164c6b',end:'#132d43',glow:'#46d8de',image:'assets/thumbnails/mathmon.png'},
  {title:'数学ファンタジーRPG',category:'数学',tags:['数学','冒険RPG'],description:'数学の問題を解きながら冒険を進める、ファンタジー世界のRPG。',url:'games/math-rpg/',published:false,icon:'⚔',word:'MATH FANTASY RPG',start:'#4d324e',end:'#1e2342',glow:'#e0a15b',image:''},
  {title:'タクティクスじゃんけん',category:'対戦',tags:['対戦','戦略'],description:'数字の配置とじゃんけんの読み合いで勝負する、戦略性のある対戦ゲーム。',url:'games/tactics-janken/index.html',published:true,icon:'✊',word:'TACTICS JANKEN',start:'#5c2c51',end:'#282045',glow:'#ed6ca3',image:'assets/thumbnails/tactics-janken.png'},
  {title:'4択しりとり',category:'パズル',tags:['言葉','パズル'],description:'イラストを見ながら言葉をつなぐ、気軽に楽しめるしりとりゲーム。',url:'games/shiritori/',published:false,icon:'あ',word:'SHIRITORI',start:'#175a55',end:'#193344',glow:'#7de5a3',image:''},
  {title:'ババ抜き・ジジ抜き',category:'トランプ',tags:['トランプ','対戦'],description:'順番に端末を交代しながら遊べる、定番のババ抜き・ジジ抜き。',url:'games/old-maid/',published:false,icon:'♠',word:'OLD MAID',start:'#34456b',end:'#18233d',glow:'#92b0ff',image:''},
  {title:'ブタのしっぽ',category:'トランプ',tags:['トランプ','対戦'],description:'カードをめくって盛り上がる、みんなで遊べるトランプゲーム。',url:'games/pig-tail/',published:false,icon:'♣',word:'PIG TAIL',start:'#5e442a',end:'#29243a',glow:'#e5b46c',image:''},
  {title:'ことわりの箱庭',category:'その他',tags:['探索','開発中'],description:'神秘的な光の世界を探索する、幻想的な新作ゲーム。',url:'games/kotowari/',published:false,icon:'✦',word:'KOTOWARI NO HAKONIWA',start:'#1e506c',end:'#24274f',glow:'#8fe1ff',image:''},
  {title:'ペントミノ・チャレンジ',category:'パズル',tags:['敷き詰め','100ステージ'],description:'12種類のペントミノを組み合わせ、盤面をすき間なく埋めよう！全100ステージで星3つを集める挑戦と、4種類の長方形に取り組むクラシックモードを収録した思考型パズル。',url:'games/pentomino-challenge/index.html',published:false,icon:'🧩',word:'PENTOMINO CHALLENGE',start:'#E3F5F0',end:'#648FB8',glow:'#79D5C1',image:'assets/thumbnails/pentomino-challenge.png'}
];
const $ = id=>document.getElementById(id);
const categories=['すべて','数学','対戦','パズル','トランプ','その他'];
let active='すべて';
const filters=$('filters'),grid=$('grid'),search=$('search');
function make(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function safeUrl(value){try{const u=new URL(value,location.href);if(!['https:','http:'].includes(u.protocol))return null;return u.href}catch{return null}}
function drawFilters(){filters.replaceChildren();categories.forEach(cat=>{const option=make('option','',cat);option.value=cat;filters.append(option)});filters.value=active}
function drawGames(){const q=search.value.trim().toLocaleLowerCase('ja');const visible=games.filter(g=>(active==='すべて'||g.category===active)&&[g.title,g.description,...g.tags].join(' ').toLocaleLowerCase('ja').includes(q));grid.replaceChildren();$('empty').hidden=visible.length>0;visible.forEach(g=>{const card=make('article','game');const art=make('div','art');art.style.setProperty('--start',g.start);art.style.setProperty('--end',g.end);art.style.setProperty('--glow',g.glow);if(g.image){const img=make('img');img.src=g.image;img.alt='';img.loading='lazy';img.onerror=()=>{img.remove();art.append(make('span','art-symbol',g.icon),make('span','art-word',g.word))};art.append(img)}else{art.append(make('span','art-symbol',g.icon),make('span','art-word',g.word))};const body=make('div','game-body');const tags=make('div','tags');g.tags.forEach(t=>tags.append(make('span','tag'+(t==='開発中'?' dev':''),t)));if(!g.published)tags.append(make('span','tag dev','公開準備中'));body.append(tags,make('h3','',g.title),make('p','desc',g.description));const link=g.url;if(g.published&&link){const a=make('a','play','ゲームをプレイ →');a.href=link;body.append(a)}else{const b=make('button','play disabled','公開準備中');b.type='button';b.disabled=true;body.append(b)}card.append(art,body);grid.append(card)})}
search.addEventListener('input',drawGames);filters.addEventListener('change',()=>{active=filters.value;drawGames()});$('year').textContent=new Date().getFullYear();drawFilters();drawGames();
</script>
</body>
</html>
